runtime: python39
entrypoint: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app

env_variables:
  GCP_PROJECT_ID: "your-project-id"
  VERTEX_AI_LOCATION: "us-central1"
  CLOUD_STORAGE_BUCKET: "aeroelite-models"

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.65

resources:
  cpu: 2
  memory_gb: 4
  disk_size_gb: 10
